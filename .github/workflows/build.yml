name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest      

    steps:
    - uses: actions/checkout@v4

    - uses: action/setup-dotnet@v4
      with:
        dotnet-version: 10.0

    - run: dotnet restore
    - run: dotnet build --no-restore
    - run: dotnet test --no-build